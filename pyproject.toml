[project]
name = "kokoro-mlx-wyoming"
version = "0.1.0"
description = "Wyoming protocol TTS server for Home Assistant, running Kokoro-82M on Apple Silicon via MLX"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # We call Kokoro through mlx-audio's model API, so stay on a known-good minor.
    "mlx-audio>=0.6.2,<0.7",
    "misaki[en]>=0.9.4",
    "en-core-web-sm",
    "wyoming[zeroconf]>=1.10,<2",
    "sentence-stream>=1.0",
    "numpy>=2",
]

[project.scripts]
kokoro-mlx-wyoming = "kokoro_mlx_wyoming.__main__:run"

[tool.uv.sources]
# misaki needs spaCy's small English model. Without it installed, misaki tries
# to download it at runtime, which fails inside a uv-managed venv.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kokoro_mlx_wyoming"]
